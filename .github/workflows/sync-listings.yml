name: Sync listings

# Každou hodinu načte tabulku s nabídkou a uloží ji do Supabase.
# Web čte přímo z databáze, takže se změna projeví bez nového commitu.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import listings into Supabase
        env:
          LISTINGS_CSV_URL: ${{ secrets.LISTINGS_CSV_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/import-csv.mjs
