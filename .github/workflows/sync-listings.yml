name: Sync listings

# Každou hodinu načte tabulku s nabídkou a pokud se změnila, commitne nový cars.json.
# GitHub Pages se pak přenasadí automaticky.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import listings from published sheet
        env:
          LISTINGS_CSV_URL: ${{ secrets.LISTINGS_CSV_URL }}
        run: node scripts/import-csv.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/data/cars.json; then
            echo "Nabídka se nezměnila."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/cars.json
          git commit -m "Update listings from sheet"
          git push
