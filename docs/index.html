<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prodej aut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..650&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="#/" class="site-title">Prodej aut</a>
      <p id="count" class="muted"></p>
    </div>
  </header>

  <div id="list-view" class="layout">
    <aside class="filters" aria-label="Filtrování nabídky">
      <div class="filters-head">
        <h2>Filtry</h2>
        <button type="button" id="reset" class="link-button">Vymazat</button>
      </div>

      <label class="field">
        <span>Značka</span>
        <select id="brand"></select>
      </label>

      <label class="field">
        <span>Model</span>
        <select id="model"></select>
      </label>

      <fieldset class="field">
        <legend>Rok výroby</legend>
        <div class="range">
          <input id="year-min" type="number" inputmode="numeric" placeholder="od">
          <input id="year-max" type="number" inputmode="numeric" placeholder="do">
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>Cena (Kč)</legend>
        <div class="range">
          <input id="price-min" type="number" inputmode="numeric" step="10000" placeholder="od">
          <input id="price-max" type="number" inputmode="numeric" step="10000" placeholder="do">
        </div>
      </fieldset>

      <label class="field">
        <span>Nájezd do <output id="mileage-out"></output> km</span>
        <input id="mileage" type="range" min="0" max="300000" step="5000" value="300000">
      </label>

      <label class="field">
        <span>Řazení</span>
        <select id="sort">
          <option value="price-asc">Cena: nejnižší</option>
          <option value="price-desc">Cena: nejvyšší</option>
          <option value="year-desc">Nejnovější</option>
          <option value="mileage-asc">Nejnižší nájezd</option>
        </select>
      </label>
    </aside>

    <main>
      <section id="cars" class="grid" aria-live="polite"></section>
      <p id="empty" class="empty" hidden>Žádný vůz neodpovídá zvoleným filtrům.</p>
    </main>
  </div>

  <div id="detail-view" class="detail" hidden></div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
